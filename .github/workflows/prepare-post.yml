name: Prepare product confirmation

on:
  workflow_dispatch:
    inputs:
      requested_product_id:
        description: "Product ID or random"
        required: true
      request_chat_id:
        description: "Telegram admin chat ID"
        required: true
      exclude_product_id:
        description: "Product ID to exclude when choosing another random product"
        required: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key to file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Select product and request confirmation
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REQUEST_CHAT_ID: ${{ github.event.inputs.request_chat_id }}
          REQUESTED_PRODUCT_ID: ${{ github.event.inputs.requested_product_id }}
          EXCLUDE_PRODUCT_ID: ${{ github.event.inputs.exclude_product_id }}
        run: python prepare_post.py

      - name: Clean up service account file
        if: always()
        run: rm -f service_account.json
